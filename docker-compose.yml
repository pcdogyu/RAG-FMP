services:
  fmp-weknora-bridge:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - default
      # Add this service to the external network used by your existing WeKnora compose stack.
      - weknora
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fmp_bridge
      POSTGRES_USER: fmp_bridge
      POSTGRES_PASSWORD: fmp_bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmp_bridge -d fmp_bridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fmp_bridge_postgres:/var/lib/postgresql/data
    networks: [default]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fmp_bridge_redis:/data
    networks: [default]
    restart: unless-stopped

volumes:
  fmp_bridge_postgres:
  fmp_bridge_redis:

networks:
  weknora:
    external: true
    name: ${WEKNORA_DOCKER_NETWORK:-weknora_default}

